{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Portal Django{% endblock %}</title>
    <!-- Importação do CSS estático -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header>
        <h1>Portal de Conteúdo</h1>
    </header>

    <nav>
        <ul>
            <!-- O menu dinâmico será injetado aqui nas próximas etapas -->
            <li><a href="/">Início</a></li>
        </ul>
    </nav>

    <main>
        <!-- Bloco onde o conteúdo dinâmico das páginas será renderizado -->
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>&copy; Desenvolvido por Sarah e Medja</p>
    </footer>
</body>
</html>
